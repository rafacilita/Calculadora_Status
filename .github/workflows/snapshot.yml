name: Snapshot diário CRR5 (D-1) + Fechamento Mensal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "daily (D-1) ou month-close (só grava se hoje for o último dia do mês)"
        type: choice
        options: [daily, month-close]
        default: daily
  schedule:
    # Diário (D-1): 06:37 BRT => 09:37 UTC. Minuto fora do pico — o slot 03:10 UTC
    # chegava a atrasar 5-7h na fila do GitHub.
    - cron: "37 9 * * *"
    # Fechamento mensal PRÉ-RESET. Os contadores mensais do Upstash zeram às
    # 00:00 UTC do dia 1 = 21:00 BRT do último dia. Três candidatos antes disso
    # (18:40, 19:20 e 20:00 BRT) para sobreviver ao atraso do cron; o script só
    # executa no último dia do mês e só grava enquanto o acumulado não zerou.
    - cron: "40 21 * * *"
    - cron: "20 22 * * *"
    - cron: "0 23 * * *"

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      TZ: America/Sao_Paulo
      METRICS_URL: ${{ secrets.METRICS_URL }}
      RUN_CRON: ${{ github.event.schedule }}
      SNAPSHOT_MODE: ${{ github.event.inputs.mode }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run snapshot
        id: snap
        run: node scripts/snapshot.js
        continue-on-error: true

      - name: Commit & push (if changed)
        run: |
          git config user.name "crr5-snapshot-bot"
          git config user.email "crr5-snapshot-bot@users.noreply.github.com"

          # evita falha se tiver commit novo no remoto
          git pull --rebase origin main || true

          if [ -n "$(git status --porcelain)" ]; then
            # sem glob pra não dar pathspec
            git add data month || true
            git commit -m "chore(snapshot): ${SNAPSHOT_MODE:-scheduled} snapshot"
            git push
          else
            echo "No changes to commit."
          fi

      - name: Fail se snapshot falhou (depois de commitar _failed)
        if: steps.snap.outcome == 'failure'
        run: |
          echo "::error::Snapshot falhou após retries. Ver data/_failed/"
          exit 1
